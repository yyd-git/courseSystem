spring:
  datasource:
    url: jdbc:mysql://localhost:3306/course_db?useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root
    password: 00000712
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: none       # ❗ 不要用 update，否则 schema.sql 不会生效
    show-sql: true
    properties:
      hibernate.dialect: org.hibernate.dialect.MySQL8Dialect

  sql:
    init:
      mode: always          # ✅ 启用初始化 SQL 脚本
      schema-locations: classpath:db/schema.sql
      data-locations: classpath:db/data.sql

  flyway:
    enabled: false          # ✅ 暂时关闭 Flyway（防止和手动 SQL 冲突）
