spring:
  datasource:
    url: jdbc:h2:mem:course_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true        # ✅ 启用 H2 控制台
      path: /h2-console    # ✅ 控制台访问路径：http://localhost:8080/h2-console
  jpa:
    hibernate:
      ddl-auto: none        # ✅ 让 schema.sql 接管建表，不用 Hibernate 自动建表
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  sql:
    init:
      mode: always          # ✅ 强制加载 schema.sql 和 data.sql
      schema-locations: classpath:schema.sql
      data-locations: classpath:data.sql
