version: '3.8'

services:
  mysql:
    image: mysql:8
    container_name: coursehub-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: 00000712
      MYSQL_DATABASE: cs_course_db
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - coursehub-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  course-service:
    build:
      context: ./course
    container_name: course-service
    ports:
      - "8081:8081"
    environment:
      SPRING_PROFILES_ACTIVE: docker
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - coursehub-network

  enrollment-service:
    build:
      context: ./student
    container_name: enrollment-service
    ports:
      - "8082:8082"
    environment:
      SPRING_PROFILES_ACTIVE: docker
    depends_on:
      mysql:
        condition: service_healthy
      course-service:
        condition: service_started
    networks:
      - coursehub-network

  catalog-service:
    build:
      context: ./catalog
    container_name: catalog-service
    ports:
      - "8083:8081"
    environment:
      SPRING_PROFILES_ACTIVE: docker
    depends_on:
      mysql:
        condition: service_healthy
      enrollment-service:
        condition: service_started
    networks:
      - coursehub-network

networks:
  coursehub-network:
    driver: bridge

volumes:
  mysql_data:
